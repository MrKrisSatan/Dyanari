[project]
name = "dyanari-image-runtime"
version = "0.9.0"
requires-python = ">=3.11,<3.12"
dependencies = [
 "comfyui-frontend-package==1.57.6", "comfyui-workflow-templates==0.11.100", "comfyui-embedded-docs==0.5.15",
 "torchsde", "numpy>=1.25", "einops", "transformers>=4.50.3", "tokenizers>=0.13.3", "sentencepiece", "safetensors>=0.4.2",
 "aiohttp>=3.11.8", "yarl>=1.18", "pyyaml", "pillow>=13", "scipy", "tqdm", "psutil", "alembic", "SQLAlchemy>=2", "filelock", "av>=17",
 "comfy-aimdo==0.6.0", "comfy-kitchen==0.2.40", "requests", "simpleeval>=1.0", "blake3", "kornia>=0.7.1", "spandrel", "pydantic~=2.0", "pydantic-settings~=2.0", "PyOpenGL>=3.1.8", "comfy-angle", "gguf>=0.13", "protobuf"
]
[dependency-groups]
cuda = ["torch==2.9.1", "torchvision==0.24.1", "torchaudio==2.9.1"]
cpu = ["torch==2.9.1", "torchvision==0.24.1", "torchaudio==2.9.1"]
[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
default-groups = ["cuda"]
conflicts = [[{group="cpu"}, {group="cuda"}]]
[tool.uv.sources]
torch = [{index="pytorch-cuda",group="cuda"},{index="pytorch-cpu",group="cpu"}]
torchvision = [{index="pytorch-cuda",group="cuda"},{index="pytorch-cpu",group="cpu"}]
torchaudio = [{index="pytorch-cuda",group="cuda"},{index="pytorch-cpu",group="cpu"}]
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
