[project]
name = "dyanari-modly-trellis"
version = "0.10.0"
requires-python = ">=3.11,<3.12"
dependencies = [
 "torch==2.9.1", "torchvision==0.24.1", "transformers==5.2.0", "accelerate", "pillow", "numpy", "scipy", "trimesh", "pymeshlab", "meshlib",
 "opencv-python-headless", "gguf", "sdnq", "open3d", "rectpack", "requests", "plyfile", "zstandard", "tqdm", "huggingface-hub", "einops", "easydict",
 "rembg", "onnxruntime", "triton-windows>=3.5,<3.6", "fastapi", "httpx", "cryptography", "ninja", "packaging"
]
[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
[tool.uv.sources]
torch = {index="pytorch-cuda"}
torchvision = {index="pytorch-cuda"}
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
