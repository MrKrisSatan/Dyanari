name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tests without inference services
        run: node --test qwen-image.test.mjs voicestudio.test.mjs agent-tasks.test.mjs development.test.mjs linked-projects.test.mjs memory-ledger.test.mjs files.test.mjs scheduler.test.mjs creative.test.mjs memory-models.test.mjs actions.test.mjs action-concurrency.test.mjs validation.test.mjs
      - name: Development API acceptance
        run: node development-http-integration.mjs
      - name: Memory API acceptance
        run: node memory-http-integration.mjs
      - name: Project task API acceptance
        run: node agent-tasks-http-integration.mjs

      - name: VoiceStudio API acceptance
        run: node voicestudio-http-integration.mjs

      - name: Qwen image API acceptance
        run: node qwen-image-http-integration.mjs
